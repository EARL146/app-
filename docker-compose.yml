services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-burger_bites_docker}
      MYSQL_USER: ${MYSQL_USER:-burger_bites_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in docker/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in docker/.env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - burger-bites-docker-mysql-data:/var/lib/mysql
      - ./backend/database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./backend/database/migrations/003_app_workflows.sql:/docker-entrypoint-initdb.d/003_app_workflows.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      default:
        aliases:
          - db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      default:
        aliases:
          - redis

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_TOKEN_PEPPER: ${APP_TOKEN_PEPPER:?Set APP_TOKEN_PEPPER in docker/.env}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
      DB_DSN: mysql:host=db;port=3306;dbname=${MYSQL_DATABASE:-burger_bites_docker};charset=utf8mb4
      DB_USERNAME: ${MYSQL_USER:-burger_bites_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in docker/.env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CONNECT_TIMEOUT: 0.25
      ORDER_TAX_PERCENT: ${ORDER_TAX_PERCENT:-12}
      ORDER_DELIVERY_FEE: ${ORDER_DELIVERY_FEE:-25.00}
    ports:
      - "127.0.0.1:${API_PORT:-8082}:8081"

volumes:
  burger-bites-docker-mysql-data:

